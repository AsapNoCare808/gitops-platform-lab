apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-com-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-com-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        url: "{{ .url }}"
        type: "{{ .type }}"
  dataFrom:
    - extract:
        key: argocd/gitlab-repo-creds
