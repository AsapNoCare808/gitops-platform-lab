# DefectDojo — valeurs optimisées pour 8Go RAM
host: defectdojo.maxto-platform.cloud
siteUrl: "https://defectdojo.maxto-platform.cloud"

imagePullPolicy: IfNotPresent

createSecret: true
createValkeySecret: true
createPostgresqlSecret: true

admin:
  user: admin
  password: "${DEFECTDOJO_ADMIN_PASSWORD}"
  firstName: Admin
  lastName: Lab
  mail: admin@maxto-platform.cloud

django:
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

celery:
  broker: valkey
  beat:
    replicas: 1
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
  worker:
    replicas: 1
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi

postgresql:
  primary:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi

valkey:
  primary:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi

extraConfigs:
  DD_CSRF_TRUSTED_ORIGINS: "https://defectdojo.maxto-platform.cloud"
  DD_CSRF_COOKIE_SECURE: "True"
  DD_SESSION_COOKIE_SECURE: "True"
  DD_SECURE_SSL_REDIRECT: "False"

ingress:
  enabled: true
  activateTLS: true
  secretName: defectdojo-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  ingressClassName: nginx
